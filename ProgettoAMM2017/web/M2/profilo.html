<!DOCTYPE html>

<html>
    <head>
        <title>NerdBook - Modifica profilo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Mario Taccori">
        <meta name="keywords" content="NerdBook profilo social network">
        <link rel="stylesheet" type="text/css" href="style.css" media="screen">
    </head>
    <body>
        
        <div class="headerBar">
            <header> <!-- Titolo -->
                <div id="title">
                    <div id="logo"></div> NerdBook
                </div>
            </header>

            <nav> <!-- Menu di navigazione -->
                <ol>   
                    <li><a class="active" id="profiloLink" href="profilo.html">Profilo</a></li>
                    <li><a id="bachecaLink" href="bacheca.html">Bacheca</a></li>
                    <li><a id="descrizioneLink" href="descrizione.html">Descrizione</a></li>
                    <li><a id="loginLink" href="login.html">Login</a></li>
                </ol>
            </nav>       
        </div>
        
        <div id="sidebar1"></div>
        <div id="sidebar2"></div>
        
        <div id="divBody">
            
            <div id="divForm"> <!-- Form dati profilo -->
                <form id="formDatiProfilo" action="#" method="post">
                    
                    <div> <!-- Nome utente -->
                        <label for="userName">Nome:</label>
                        <input type="text" name="userName" id="userName">
                    </div>
                    
                    <div> <!-- Cognome utente -->
                        <label for="userName">Cognome:</label>
                        <input type="text" name="userSurname" id="userSurname">
                    </div>
                    
                    <div> <!-- Immagine profilo -->
                        <label for="profilePic">Url immagine profilo:</label>
                        <input type="url" name="profilePic" id="profilePic">
                    </div>
                    
                    <div> <!-- Presentazione -->
                        <label for="presentazione">Presentazione:</label>
                        <textarea name="presentazione" id="presentazione"></textarea>
                    </div>
                    
                    <div> <!-- Data di nascita -->
                        <label for="bDate">Data di nascita:</label>
                        <input type="date" name="bDate" id="bDate">
                    </div>
                    
                    <div> <!-- Password -->
                        <label for="password">Password:</label>
                        <input type="password" name="password" id="password">
                    </div>
                    
                    <div> <!-- Conferma password -->
                        <label for="passwordConfirm">Conferma password:</label>
                        <input type="password" name="passwordConfirm" id="passwordConfirm">
                    </div>
                    
                    <div>
                        <input type="submit" form="formDatiProfilo" value="Modifica">
                    </div>
                </form> 
            </div> <!-- Fine form login -->
            
        </div>

    </body>
</html>

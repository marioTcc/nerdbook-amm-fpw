<!DOCTYPE html>

<html>
    <head>
        <title>NerdBook - Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Mario Taccori">
        <meta name="keywords" content="NerdBook login social network">
        <link rel="stylesheet" type="text/css" href="style.css" media="screen">
    </head>
    
    <body>
        <header> <!-- Titolo -->
            <div id="title">
                Pagina di login per NerdBook
            </div>
        </header>
        
        <nav> <!-- Menu di navigazione -->
            <ol>
                <li><a href="descrizione.html">Descrizione</a></li>
                <li><a href="profilo.html">Profilo</a></li>
                <li><a href="bacheca.html">Bacheca</a></li>
            </ol>
        </nav>

        <div id="divBody">
            
            <div> <!-- Contenitore form di login -->
                <form id="loginForm" method="post" action="#">
                    <div>
                        <label for="username">Username:</label>
                        <input type="text" name="username" id="username">
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" name="password" id="password">
                    </div>
                    <div>
                        <button type="submit">Accedi</button>
                    </div>
                </form>
            </div> <!-- Fine form di login -->
            
        </div>
    </body>
</html>

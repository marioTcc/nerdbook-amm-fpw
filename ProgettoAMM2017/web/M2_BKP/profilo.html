<!DOCTYPE html>

<html>
    <head>
        <title>NerdBook - Modifica profilo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Mario Taccori">
        <meta name="keywords" content="NerdBook profilo social network">
        <link rel="stylesheet" type="text/css" href="style.css" media="screen">
    </head>
    <body>
        
        <div class="headerBar">
            <header> <!-- Titolo -->
                <div id="title">
                    <img id="logo" src="../Assets/ICONS/NerdBook_logo.svg" alt="Logo del social network" />NerdBook
                </div>
            </header>

            <nav> <!-- Menu di navigazione -->
                <ol>   
                    <li class="active"><a id="profiloLink" href="profilo.html"><img src="../Assets/ICONS/profilo_icona.svg" alt="immagine tasto profilo" />Profilo</a></li>
                    <li><a id="bachecaLink" href="bacheca.html"><img src="../Assets/ICONS/bacheca_icona.svg" alt="immagine tasto bacheca" />Bacheca</a></li>
                    <li><a id="descrizioneLink" href="descrizione.html"><img src="../Assets/ICONS/descrizione_icona.svg" alt="immagine tasto descrizione" />Descrizione</a></li>
                    <li><a id="loginLink" href="login.html"><img src="../Assets/ICONS/login_icona.svg" alt="immagine tasto login" />Login</a></li>
                </ol>
            </nav>       
        </div>
        
        <div id="sidebar1">
            <div id="searchBar">
                <input type="text" value="Cerca">
            </div>
            
            <div id="elencoPersone">
                <h4>Persone:</h4>
                <ul>
                    <li>Persona Uno</li>
                    <li>Persona Due</li>
                    <li>Persona Tre</li>
                </ul>
            </div>
            
            <div id="elencoGruppi">
                <h4>Gruppi:</h4>
                <ul>
                    <li>Molgonfieristi</li>
                    <li>Ritardatari</li>
                </ul>
            </div>
        </div>
        
        <div id="divBody">
            
            <div>

                <div id="profilePic">
                    <img src="../Assets/IMG/djanniprofilo.jpg" alt="Foto autore del post">
                </div>

                <div id="divForm"> <!-- Form dati profilo -->
                    <form id="formDatiProfilo" action="#" method="post">

                        <div> <!-- Nome utente -->
                            <label for="userName">Nome:</label>
                            <input type="text" name="userName" id="userName">
                        </div>

                        <div> <!-- Cognome utente -->
                            <label for="userName">Cognome:</label>
                            <input type="text" name="userSurname" id="userSurname">
                        </div>

                        <div> <!-- Immagine profilo -->
                            <label for="profilePicURL">Url immagine profilo:</label>
                            <input type="url" name="profilePicURL" id="profilePicURL">
                        </div>

                        <div> <!-- Presentazione -->
                            <label for="presentazione">Presentazione:</label>
                            <textarea name="presentazione" id="presentazione"></textarea>
                        </div>

                        <div> <!-- Data di nascita -->
                            <label for="bDate">Data di nascita:</label>
                            <input type="date" name="bDate" id="bDate">
                        </div>

                        <div> <!-- Password -->
                            <label for="password">Password:</label>
                            <input type="password" name="password" id="password">
                        </div>

                        <div> <!-- Conferma password -->
                            <label for="passwordConfirm">Conferma password:</label>
                            <input type="password" name="passwordConfirm" id="passwordConfirm">
                        </div>

                        <div>
                            <button type="submit" form="formDatiProfilo">Aggiorna</button>
                        </div>
                    </form> 
                </div> <!-- Fine form login -->
            </div>
        </div>

    </body>
</html>
